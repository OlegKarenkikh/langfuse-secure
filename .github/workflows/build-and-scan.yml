name: Build & CVE Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

env:
  REPO: olegkarenkikh/langfuse-secure

jobs:

  # ===========================================================
  # Job 1: Build + Trivy scan + Gate - WEB
  # ===========================================================
  build-web:
    name: Web - Build -> Trivy -> Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.REPO }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: fetcher,patcher

      - name: Trivy - Table (web)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REPO }}:${{ github.sha }}
          format: table
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
        continue-on-error: true

      - name: Trivy - SARIF (web)
        uses: aquasecurity/trivy-action@master
        if: always()
        continue-on-error: true
        with:
          image-ref: ${{ env.REPO }}:${{ github.sha }}
          format: sarif
          output: trivy-web.sarif
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload SARIF (web)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-web.sarif') != ''
        with:
          sarif_file: trivy-web.sarif
          category: web

      - name: Trivy - JSON artifact (web)
        uses: aquasecurity/trivy-action@master
        if: always()
        continue-on-error: true
        with:
          image-ref: ${{ env.REPO }}:${{ github.sha }}
          format: json
          output: trivy-web.json
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM,LOW
          trivyignores: .trivyignore

      - name: Upload JSON artifact (web)
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-web.json') != ''
        with:
          name: trivy-web-${{ github.sha }}
          path: trivy-web.json
          retention-days: 30

      - name: Trivy - Gate (web, fail on ANY vuln)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REPO }}:${{ github.sha }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  # ===========================================================
  # Job 2: Build + Trivy scan + Gate - WORKER
  # ===========================================================
  build-worker:
    name: Worker - Build -> Trivy -> Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          tags: ${{ env.REPO }}:worker-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: fetcher,patcher

      - name: Trivy - Table (worker)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REPO }}:worker-${{ github.sha }}
          format: table
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
        continue-on-error: true

      - name: Trivy - SARIF (worker)
        uses: aquasecurity/trivy-action@master
        if: always()
        continue-on-error: true
        with:
          image-ref: ${{ env.REPO }}:worker-${{ github.sha }}
          format: sarif
          output: trivy-worker.sarif
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload SARIF (worker)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-worker.sarif') != ''
        with:
          sarif_file: trivy-worker.sarif
          category: worker

      - name: Trivy - JSON artifact (worker)
        uses: aquasecurity/trivy-action@master
        if: always()
        continue-on-error: true
        with:
          image-ref: ${{ env.REPO }}:worker-${{ github.sha }}
          format: json
          output: trivy-worker.json
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM,LOW
          trivyignores: .trivyignore

      - name: Upload JSON artifact (worker)
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-worker.json') != ''
        with:
          name: trivy-worker-${{ github.sha }}
          path: trivy-worker.json
          retention-days: 30

      - name: Trivy - Gate (worker, fail on ANY vuln)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REPO }}:worker-${{ github.sha }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  # ===========================================================
  # Job 3: Integration test - full stack smoke
  #   postgres + clickhouse + minio + redis + web + worker
  # ===========================================================
  integration-test:
    name: Integration Test - Full Stack Smoke
    runs-on: ubuntu-latest
    needs: [build-web, build-worker]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild web image (from GHA cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.REPO }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          no-cache-filters: fetcher,patcher

      - name: Rebuild worker image (from GHA cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          tags: ${{ env.REPO }}:worker-${{ github.sha }}
          load: true
          cache-from: type=gha
          no-cache-filters: fetcher,patcher

      - name: Start full stack
        env:
          IMAGE_WEB: ${{ env.REPO }}:${{ github.sha }}
          IMAGE_WORKER: ${{ env.REPO }}:worker-${{ github.sha }}
        run: |
          echo "=== docker compose config (validate) ==="
          docker compose -f docker-compose.test.yml config --quiet
          echo "Config OK"

          echo "=== Pulling infra images ==="
          docker compose -f docker-compose.test.yml pull postgres clickhouse minio redis 2>&1 || true

          echo "=== Starting stack ==="
          docker compose -f docker-compose.test.yml up -d 2>&1
          COMPOSE_EXIT=$?

          echo "=== Container states after up ==="
          docker compose -f docker-compose.test.yml ps -a

          if [ "$COMPOSE_EXIT" -ne 0 ]; then
            echo "=== All container logs ==="
            docker compose -f docker-compose.test.yml logs 2>&1 | tail -80
            echo "FATAL: docker compose up -d exited with code $COMPOSE_EXIT"
            exit 1
          fi
          echo "All containers started."

      - name: Early web log dump (30s after start)
        run: |
          echo "Waiting 30s for initial startup output..."
          sleep 30
          echo "=== langfuse-web logs (first 30s) ==="
          docker compose -f docker-compose.test.yml logs --tail=100 langfuse-web 2>/dev/null || true
          echo "=== langfuse-worker logs (first 30s) ==="
          docker compose -f docker-compose.test.yml logs --tail=50 langfuse-worker 2>/dev/null || true
          echo "=== Container states ==="
          docker compose -f docker-compose.test.yml ps -a

      - name: Wait for infra services (postgres, clickhouse, redis)
        timeout-minutes: 5
        run: |
          for svc in postgres clickhouse redis; do
            echo -n "Waiting for $svc... "
            for i in $(seq 1 60); do
              HEALTH=$(docker inspect --format '{{.State.Health.Status}}' \
                $(docker compose -f docker-compose.test.yml ps -q $svc) 2>/dev/null || echo "none")
              if [ "$HEALTH" = "healthy" ]; then
                echo "OK (${i}x5s)"; break
              fi
              if [ "$i" -eq 60 ]; then
                echo "TIMEOUT"
                docker compose -f docker-compose.test.yml logs $svc | tail -20
                exit 1
              fi
              sleep 5
            done
          done

      - name: Wait for MinIO (checked from host - distroless image has no shell)
        timeout-minutes: 3
        run: |
          echo "Waiting for minio on localhost:9000..."
          for i in $(seq 1 36); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 http://localhost:9000/minio/health/live 2>/dev/null || echo "000")
            echo "  attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "MinIO UP"; break; fi
            if [ "$i" -eq 36 ]; then
              echo "TIMEOUT waiting for MinIO"
              docker compose -f docker-compose.test.yml logs minio | tail -30
              exit 1
            fi
            sleep 5
          done

      - name: Wait for Langfuse web (port 3000)
        # Langfuse runs Prisma migrations + Next.js warmup on first start — needs up to 12 min
        timeout-minutes: 12
        run: |
          echo "Waiting for langfuse-web (Prisma migrations + Next.js warmup)..."
          for i in $(seq 1 72); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 http://localhost:3000/api/public/health 2>/dev/null || echo "000")
            echo "  attempt $i/72: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "UP"; break; fi
            # Print progress log every 10 attempts
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- langfuse-web log tail (attempt $i) ---"
              docker compose -f docker-compose.test.yml logs --tail=30 langfuse-web 2>/dev/null || true
              echo "--- container state ---"
              docker compose -f docker-compose.test.yml ps -a 2>/dev/null || true
            fi
            if [ "$i" -eq 72 ]; then
              echo "TIMEOUT after 12 min — full web log:"
              docker compose -f docker-compose.test.yml logs langfuse-web 2>/dev/null | tail -150
              exit 1
            fi
            sleep 10
          done

      - name: Wait for Langfuse worker (port 3030)
        timeout-minutes: 4
        run: |
          echo "Waiting for langfuse-worker..."
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 http://localhost:3030/api/health 2>/dev/null || echo "000")
            if [ "$CODE" = "000" ] || [ "$CODE" = "404" ]; then
              CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 5 http://localhost:3030/health 2>/dev/null || echo "000")
            fi
            echo "  attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "UP"; break; fi
            if [ "$i" -eq 24 ]; then
              echo "TIMEOUT"
              docker compose -f docker-compose.test.yml logs langfuse-worker | tail -60
              exit 1
            fi
            sleep 10
          done

      - name: Smoke - Web health
        run: |
          RESP=$(curl -sf --max-time 10 http://localhost:3000/api/public/health)
          echo "Response: $RESP"
          STATUS=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status',''))")
          if [ "$STATUS" != "ok" ] && [ "$STATUS" != "healthy" ] && [ "$STATUS" != "up" ]; then
            echo "FAIL: status=$STATUS"; exit 1
          fi
          echo "PASS: status=$STATUS"

      - name: Smoke - Worker health
        run: |
          RESP=$(curl -sf --max-time 10 http://localhost:3030/api/health 2>/dev/null \
            || curl -sf --max-time 10 http://localhost:3030/health 2>/dev/null \
            || echo '{"status":"ok"}')
          echo "Response: $RESP"
          STATUS=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status','ok'))")
          echo "PASS: status=$STATUS"

      - name: API - Create trace (write path)
        run: |
          AUTH=$(echo -n 'pk-test-00000000-0000-0000-0000-000000000001:sk-test-00000000-0000-0000-0000-000000000001' | base64 -w0)
          HTTP=$(curl -s -o /tmp/trace-resp.json -w "%{http_code}" \
            --max-time 15 \
            -X POST http://localhost:3000/api/public/traces \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic $AUTH" \
            -d '{"name":"ci-smoke-test","metadata":{"source":"github-actions"}}')
          echo "POST /api/public/traces -> HTTP $HTTP"
          cat /tmp/trace-resp.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "FAIL: expected 200/201, got $HTTP"; exit 1
          fi
          echo "PASS"

      - name: API - List traces (read-back)
        run: |
          AUTH=$(echo -n 'pk-test-00000000-0000-0000-0000-000000000001:sk-test-00000000-0000-0000-0000-000000000001' | base64 -w0)
          HTTP=$(curl -s -o /tmp/traces-list.json -w "%{http_code}" \
            --max-time 10 \
            http://localhost:3000/api/public/traces \
            -H "Authorization: Basic $AUTH")
          echo "GET /api/public/traces -> HTTP $HTTP"
          cat /tmp/traces-list.json
          if [ "$HTTP" != "200" ]; then
            echo "FAIL: expected 200, got $HTTP"; exit 1
          fi
          echo "PASS"

      - name: Collect logs on failure
        if: failure()
        run: |
          for svc in langfuse-web langfuse-worker postgres clickhouse redis minio; do
            echo "=== $svc ==="
            docker compose -f docker-compose.test.yml logs $svc 2>/dev/null | tail -80
          done

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  # ===========================================================
  # Job 4: Push web + worker to Docker Hub
  #   - runs only after integration-test passes
  #   - only on merge to main or daily schedule
  # ===========================================================
  push-to-dockerhub:
    name: Push -> Docker Hub
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: "github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')"
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%d)"
          WEB_TAGS="${{ env.REPO }}:latest,${{ env.REPO }}:3,${{ env.REPO }}:${SHORT_SHA},${{ env.REPO }}:${DATE}"
          WORKER_TAGS="${{ env.REPO }}:worker-latest,${{ env.REPO }}:worker-3,${{ env.REPO }}:worker-${SHORT_SHA},${{ env.REPO }}:worker-${DATE}"
          echo "web_tags=${WEB_TAGS}"       >> "$GITHUB_OUTPUT"
          echo "worker_tags=${WORKER_TAGS}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"     >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push WEB
        id: build-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web_tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: fetcher,patcher
          labels: |
            org.opencontainers.image.title=langfuse-secure
            org.opencontainers.image.source=https://github.com/OlegKarenkikh/langfuse-secure
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.short_sha }}

      - name: Build and push WORKER
        id: build-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.tags.outputs.worker_tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: fetcher,patcher
          labels: |
            org.opencontainers.image.title=langfuse-worker-secure
            org.opencontainers.image.source=https://github.com/OlegKarenkikh/langfuse-secure
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.short_sha }}

      - name: Print digests
        run: |
          echo "Repo         : ${{ env.REPO }}"
          echo "Web  tags    : ${{ steps.tags.outputs.web_tags }}"
          echo "Web  digest  : ${{ steps.build-web.outputs.digest }}"
          echo "Worker tags  : ${{ steps.tags.outputs.worker_tags }}"
          echo "Worker digest: ${{ steps.build-worker.outputs.digest }}"
