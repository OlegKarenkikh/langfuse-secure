name: Build & CVE Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

env:
  REPO: olegkarenkikh/langfuse-secure

jobs:

  # ===========================================================
  # Job 1: Build + Trivy scan + Gate — WEB
  # ===========================================================
  build-web:
    name: Web — Build -> Trivy -> Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.REPO }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy - Table (web)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REPO }}:${{ github.sha }}
          format: table
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
        continue-on-error: true

      - name: Trivy - SARIF (web)
        uses: aquasecurity/trivy-action@master
        if: always()
        continue-on-error: true
        with:
          image-ref: ${{ env.REPO }}:${{ github.sha }}
          format: sarif
          output: trivy-web.sarif
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload SARIF (web)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-web.sarif') != ''
        with:
          sarif_file: trivy-web.sarif
          category: web

      - name: Trivy - JSON artifact (web)
        uses: aquasecurity/trivy-action@master
        if: always()
        continue-on-error: true
        with:
          image-ref: ${{ env.REPO }}:${{ github.sha }}
          format: json
          output: trivy-web.json
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM,LOW
          trivyignores: .trivyignore

      - name: Upload JSON artifact (web)
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-web.json') != ''
        with:
          name: trivy-web-${{ github.sha }}
          path: trivy-web.json
          retention-days: 30

      - name: Trivy - Gate (web, fail on CRITICAL/HIGH vuln)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REPO }}:${{ github.sha }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  # ===========================================================
  # Job 2: Build + Trivy scan + Gate — WORKER
  # ===========================================================
  build-worker:
    name: Worker — Build -> Trivy -> Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          tags: ${{ env.REPO }}:worker-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy - Table (worker)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REPO }}:worker-${{ github.sha }}
          format: table
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
        continue-on-error: true

      - name: Trivy - SARIF (worker)
        uses: aquasecurity/trivy-action@master
        if: always()
        continue-on-error: true
        with:
          image-ref: ${{ env.REPO }}:worker-${{ github.sha }}
          format: sarif
          output: trivy-worker.sarif
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload SARIF (worker)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-worker.sarif') != ''
        with:
          sarif_file: trivy-worker.sarif
          category: worker

      - name: Trivy - JSON artifact (worker)
        uses: aquasecurity/trivy-action@master
        if: always()
        continue-on-error: true
        with:
          image-ref: ${{ env.REPO }}:worker-${{ github.sha }}
          format: json
          output: trivy-worker.json
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM,LOW
          trivyignores: .trivyignore

      - name: Upload JSON artifact (worker)
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-worker.json') != ''
        with:
          name: trivy-worker-${{ github.sha }}
          path: trivy-worker.json
          retention-days: 30

      - name: Trivy - Gate (worker, fail on CRITICAL/HIGH vuln)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REPO }}:worker-${{ github.sha }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  # ===========================================================
  # Job 3: Push web + worker to Docker Hub (single repo)
  #   - runs only after BOTH gates pass
  #   - only on merge to main or daily schedule
  # ===========================================================
  push-to-dockerhub:
    name: Push -> Docker Hub
    runs-on: ubuntu-latest
    needs: [build-web, build-worker]
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%d)"
          WEB_TAGS="${{ env.REPO }}:latest,${{ env.REPO }}:3,${{ env.REPO }}:${SHORT_SHA},${{ env.REPO }}:${DATE}"
          WORKER_TAGS="${{ env.REPO }}:worker-latest,${{ env.REPO }}:worker-3,${{ env.REPO }}:worker-${SHORT_SHA},${{ env.REPO }}:worker-${DATE}"
          echo "web_tags=${WEB_TAGS}"       >> "$GITHUB_OUTPUT"
          echo "worker_tags=${WORKER_TAGS}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"     >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push WEB
        id: build-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web_tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=langfuse-secure
            org.opencontainers.image.source=https://github.com/OlegKarenkikh/langfuse-secure
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.short_sha }}

      - name: Build and push WORKER
        id: build-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.tags.outputs.worker_tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=langfuse-worker-secure
            org.opencontainers.image.source=https://github.com/OlegKarenkikh/langfuse-secure
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.short_sha }}

      - name: Print digests
        run: |
          echo "Repo         : ${{ env.REPO }}"
          echo "Web  tags    : ${{ steps.tags.outputs.web_tags }}"
          echo "Web  digest  : ${{ steps.build-web.outputs.digest }}"
          echo "Worker tags  : ${{ steps.tags.outputs.worker_tags }}"
          echo "Worker digest: ${{ steps.build-worker.outputs.digest }}"
